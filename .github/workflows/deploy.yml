name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_LOCATION: westus2

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      resource-group: ${{ steps.deploy.outputs.resourceGroupName }}
      site-name: ${{ steps.deploy.outputs.siteName }}
      default-hostname: ${{ steps.deploy.outputs.defaultHostname }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (AVM)
        id: deploy
        run: |
          outputs=$(az deployment sub create \
            --name "jumplab-${GITHUB_RUN_ID}" \
            --location "$AZURE_LOCATION" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)
          for key in resourceGroupName siteName defaultHostname; do
            echo "$key=$(jq -r ".$key.value" <<<"$outputs")" >> "$GITHUB_OUTPUT"
          done

  app:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build:physics
          npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ needs.infra.outputs.site-name }}" \
            --resource-group "${{ needs.infra.outputs.resource-group }}" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
